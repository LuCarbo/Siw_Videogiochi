<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#141416"/>
  <rect x="1" y="1" width="598" height="398" rx="8" stroke="#27272a" stroke-width="2"/>
  
  <!-- Gamepad Icon -->
  <g transform="translate(250, 130)" stroke="#89F336" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="20" width="100" height="60" rx="20" fill="#1e1e22" stroke="#3f3f46" stroke-width="2"/>
    <!-- D-Pad -->
    <path d="M 25 40 L 25 60 M 15 50 L 35 50" stroke="#71717a" stroke-width="3"/>
    <!-- Action Buttons -->
    <circle cx="75" cy="42" r="3" fill="#89F336"/>
    <circle cx="85" cy="50" r="3" fill="#f59e0b"/>
    <circle cx="65" cy="50" r="3" fill="#10b981"/>
    <circle cx="75" cy="58" r="3" fill="#9ca3af"/>
  </g>
  
  <!-- Text -->
  <text x="300" y="250" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#d4d4d8">
    Nessuna Copertina Disponibile
  </text>
  <text x="300" y="276" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#71717a">
    Game Vault
  </text>
</svg>

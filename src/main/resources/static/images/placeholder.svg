<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#0e1626"/>
  <rect x="1" y="1" width="598" height="398" rx="8" stroke="#2d3b55" stroke-width="2"/>
  
  <!-- Gamepad Icon -->
  <g transform="translate(250, 130)" stroke="#6366f1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="20" width="100" height="60" rx="20" fill="#182234" stroke="#4f46e5" stroke-width="3"/>
    <!-- D-Pad -->
    <path d="M 25 40 L 25 60 M 15 50 L 35 50" stroke="#94a3b8" stroke-width="3"/>
    <!-- Action Buttons -->
    <circle cx="75" cy="42" r="3" fill="#38bdf8"/>
    <circle cx="85" cy="50" r="3" fill="#ec4899"/>
    <circle cx="65" cy="50" r="3" fill="#10b981"/>
    <circle cx="75" cy="58" r="3" fill="#f59e0b"/>
  </g>
  
  <!-- Text -->
  <text x="300" y="250" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1">
    Nessuna Copertina Disponibile
  </text>
  <text x="300" y="278" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#64748b">
    Game Vault
  </text>
</svg>

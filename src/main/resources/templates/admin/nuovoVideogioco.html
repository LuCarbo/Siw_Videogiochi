<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Videogioco - Pannello Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container" style="max-width: 680px;">

        <!-- Breadcrumb -->
        <nav class="breadcrumb">
            <a th:href="@{/admin/dashboard}">Pannello Admin</a>
            <span class="breadcrumb-sep">/</span>
            <span>Nuovo Videogioco</span>
        </nav>

        <div class="page-header" style="margin-bottom: 2rem;">
            <div>
                <span class="badge badge-admin" style="margin-bottom: 0.4rem;">Admin</span>
                <h1 class="page-title">Inserisci Videogioco</h1>
                <p class="page-subtitle">Inserimento manuale di un nuovo titolo a catalogo.</p>
            </div>
        </div>

        <div class="form-card">
            <form th:action="@{/admin/videogioco/nuovo}" th:object="${videogiocoForm}" method="post" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label for="titolo" class="form-label">Titolo del Videogioco *</label>
                    <input type="text" id="titolo" th:field="*{titolo}" class="form-control" placeholder="es. The Witcher 3: Wild Hunt" autocomplete="off" />
                    <div th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label for="annoUscita" class="form-label">Anno di Uscita</label>
                    <input type="number" id="annoUscita" th:field="*{annoUscita}" class="form-control" placeholder="es. 2024" min="1950" max="2100" />
                    <div th:if="${#fields.hasErrors('annoUscita')}" th:errors="*{annoUscita}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label for="immagineFile" class="form-label">Immagine di Copertina</label>
                    <input type="file" id="immagineFile" th:field="*{immagineFile}" accept="image/png, image/jpeg, image/webp, image/gif" class="form-control" />
                    <small style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 0.35rem;">
                        Carica un file immagine dal computer (PNG, JPG, WEBP). L'immagine verrà convertita e memorizzata in formato Base64.
                    </small>
                    <div th:if="${#fields.hasErrors('immagineFile')}" th:errors="*{immagineFile}" class="form-error"></div>

                    <!-- Anteprima live dell'immagine selezionata -->
                    <div id="anteprimaContainer" style="margin-top: 0.85rem; display: none;">
                        <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 0.35rem;">Anteprima copertina:</span>
                        <img id="anteprimaImg" src="" alt="Anteprima copertina" style="max-height: 180px; max-width: 100%; border-radius: 6px; border: 1px solid var(--border-medium); object-fit: cover;" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="descrizione" class="form-label">Descrizione del Gioco</label>
                    <textarea id="descrizione" th:field="*{descrizione}" rows="4" class="form-control" placeholder="Descrizione dettagliata della trama, caratteristiche di gioco e ambientazione..."></textarea>
                    <div th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="form-error"></div>
                </div>

                <div style="display: flex; gap: 0.85rem; margin-top: 1.75rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        Salva nel Catalogo Locale
                    </button>
                    <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
                        Annulla
                    </a>
                </div>

            </form>
        </div>

    </main>

    <script>
        document.getElementById('immagineFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const container = document.getElementById('anteprimaContainer');
            const img = document.getElementById('anteprimaImg');
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    img.src = evt.target.result;
                    container.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                container.style.display = 'none';
                img.src = '';
            }
        });
    </script>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Videogioco - Pannello Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container" style="max-width: 650px; padding: 2rem;">

        <div class="page-header" style="margin-bottom: 2rem;">
            <a th:href="@{/admin/dashboard}" style="color: var(--text-muted); font-size: 0.9rem; text-decoration: none;">← Torna alla Dashboard Admin</a>
            <h1 class="page-title" style="margin-top: 0.5rem;">Aggiungi Nuovo Videogioco</h1>
            <p style="color: var(--text-muted);">Inserisci manualmente un titolo nel database locale.</p>
        </div>

        <div style="background: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 2rem;">
            <form th:action="@{/admin/videogioco/nuovo}" th:object="${videogiocoForm}" method="post" style="display: flex; flex-direction: column; gap: 1.25rem;">
                
                <div class="form-group">
                    <label for="titolo">Titolo del Videogioco *</label>
                    <input type="text" id="titolo" th:field="*{titolo}" class="form-control" autocomplete="off" />
                    <div th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}" class="error-msg" style="margin-top: 0.35rem; font-size: 0.85rem; color: #ef4444;"></div>
                </div>

                <div class="form-group">
                    <label for="annoUscita">Anno di Uscita</label>
                    <input type="number" id="annoUscita" th:field="*{annoUscita}" class="form-control" placeholder="es. 2024" />
                    <div th:if="${#fields.hasErrors('annoUscita')}" th:errors="*{annoUscita}" class="error-msg" style="margin-top: 0.35rem; font-size: 0.85rem; color: #ef4444;"></div>
                </div>

                <div class="form-group">
                    <label for="urlCopertina">URL Immagine di Copertina</label>
                    <input type="url" id="urlCopertina" th:field="*{urlCopertina}" class="form-control" placeholder="https://..." />
                </div>

                <div class="form-group">
                    <label for="descrizione">Descrizione</label>
                    <textarea id="descrizione" th:field="*{descrizione}" rows="5" class="form-control" style="resize: vertical;"></textarea>
                    <div th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="error-msg" style="margin-top: 0.35rem; font-size: 0.85rem; color: #ef4444;"></div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1; padding: 0.75rem;">
                        Salva nel Catalogo
                    </button>
                    <a th:href="@{/admin/dashboard}" class="btn" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); text-decoration: none; padding: 0.75rem 1.5rem; text-align: center;">
                        Annulla
                    </a>
                </div>

            </form>
        </div>

    </div>

</body>

</html>

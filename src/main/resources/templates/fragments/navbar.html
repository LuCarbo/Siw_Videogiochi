<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <nav class="navbar" th:fragment="navbar">
        <!-- Brand -->
        <a th:href="@{/videogiochi}" class="navbar-brand">
            <span class="brand-dot"></span>
            <span>Game Vault</span>
        </a>

        <!-- Center: React Realtime Search Bar -->
        <div class="navbar-center">
            <div id="react-search-bar"></div>
        </div>

        <!-- Right: Links & Auth -->
        <div class="nav-links">
            <a th:href="@{/videogiochi}" class="nav-link">Catalogo DB</a>
            <a th:href="@{/rawg/popolari}" class="nav-link">Esplora RAWG</a>
            <a th:href="@{/utenti}" class="nav-link">Community</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/libreria}" class="nav-link">La Mia Libreria</a>

            <!-- Admin Shortcut -->
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-admin btn-sm">
                Pannello Admin
            </a>

            <!-- Anonymous Links -->
            <a sec:authorize="isAnonymous()" th:href="@{/register}" class="nav-link">Registrati</a>
            <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-primary btn-sm">Accedi</a>

            <!-- Authenticated User & Logout -->
            <div sec:authorize="isAuthenticated()" class="user-status">
                <span sec:authentication="name" style="font-weight: 600;">Utente</span>
                <span sec:authorize="hasRole('ADMIN')" class="badge badge-admin">Admin</span>
                <span sec:authorize="!hasRole('ADMIN')" class="badge badge-user">User</span>
            </div>

            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn btn-secondary btn-sm">
                    Esci
                </button>
            </form>
        </div>

        <!-- React 18 & Babel Integration for Async Search -->
        <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

        <script type="text/babel">
            /*<![CDATA[*/
            const { useState, useEffect, useRef } = React;

            function SearchBar() {
                const [search, setSearch] = useState('');
                const [results, setResults] = useState([]);
                const [loading, setLoading] = useState(false);
                const [showDropdown, setShowDropdown] = useState(false);
                const containerRef = useRef(null);

                useEffect(() => {
                    if (!search.trim()) {
                        setResults([]);
                        setShowDropdown(false);
                        return;
                    }

                    const delayDebounceFn = setTimeout(() => {
                        fetchResults();
                    }, 400);

                    return () => clearTimeout(delayDebounceFn);
                }, [search]);

                // Close dropdown when clicking outside
                useEffect(() => {
                    function handleClickOutside(event) {
                        if (containerRef.current && !containerRef.current.contains(event.target)) {
                            setShowDropdown(false);
                        }
                    }
                    document.addEventListener('mousedown', handleClickOutside);
                    return () => document.removeEventListener('mousedown', handleClickOutside);
                }, []);

                const fetchResults = () => {
                    setLoading(true);
                    fetch(`/api/rawg/ricerca?query=${encodeURIComponent(search.trim())}`)
                        .then(res => res.json())
                        .then(data => {
                            setResults(data || []);
                            setLoading(false);
                            setShowDropdown(true);
                        })
                        .catch(err => {
                            console.error(err);
                            setLoading(false);
                        });
                };

                return (
                    <div ref={containerRef} style={{ position: 'relative', width: '100%' }}>
                        <div style={{ position: 'relative' }}>
                            <input
                                type="text"
                                placeholder="Cerca un gioco (RAWG)..."
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                                onFocus={() => { if (results.length > 0) setShowDropdown(true); }}
                                style={{
                                    width: '100%',
                                    padding: '0.45rem 0.85rem',
                                    paddingRight: loading ? '2rem' : '0.85rem',
                                    borderRadius: '6px',
                                    border: '1px solid #2d3b55',
                                    fontSize: '0.88rem',
                                    boxSizing: 'border-box',
                                    backgroundColor: '#0e1626',
                                    color: '#f8fafc',
                                    outline: 'none'
                                }}
                            />
                            {loading && (
                                <span style={{
                                    position: 'absolute',
                                    right: '8px',
                                    top: '50%',
                                    transform: 'translateY(-50%)',
                                    color: '#94a3b8',
                                    fontSize: '0.75rem'
                                }}>
                                    ...
                                </span>
                            )}
                        </div>

                        {showDropdown && results.length > 0 && (
                            <div style={{
                                position: 'absolute',
                                top: 'calc(100% + 4px)',
                                left: 0,
                                right: 0,
                                backgroundColor: '#131b2e',
                                borderRadius: '8px',
                                border: '1px solid #2d3b55',
                                boxShadow: '0 10px 25px rgba(0,0,0,0.5)',
                                zIndex: 1000,
                                maxHeight: '360px',
                                overflowY: 'auto'
                            }}>
                                {results.map(gioco => (
                                    <a
                                        key={gioco.id}
                                        href={`/rawg/gioco/${gioco.id}`}
                                        style={{
                                            display: 'flex',
                                            alignItems: 'center',
                                            padding: '8px 12px',
                                            textDecoration: 'none',
                                            color: '#f8fafc',
                                            borderBottom: '1px solid #1e293d',
                                            transition: 'background-color 0.15s ease'
                                        }}
                                        onMouseOver={(e) => e.currentTarget.style.backgroundColor = '#1a233a'}
                                        onMouseOut={(e) => e.currentTarget.style.backgroundColor = 'transparent'}
                                    >
                                        <img
                                            src={gioco.background_image || 'https://via.placeholder.com/40x40?text=?'}
                                            alt=""
                                            style={{
                                                width: '38px',
                                                height: '38px',
                                                objectFit: 'cover',
                                                borderRadius: '4px',
                                                marginRight: '10px',
                                                flexShrink: 0
                                            }}
                                        />
                                        <div style={{ minWidth: 0, flex: 1 }}>
                                            <div style={{
                                                fontWeight: '600',
                                                fontSize: '0.88rem',
                                                whiteSpace: 'nowrap',
                                                overflow: 'hidden',
                                                textOverflow: 'ellipsis'
                                            }}>
                                                {gioco.name}
                                            </div>
                                            <div style={{ fontSize: '0.78rem', color: '#94a3b8' }}>
                                                {gioco.released ? gioco.released.substring(0, 4) : 'N/A'}
                                            </div>
                                        </div>
                                    </a>
                                ))}
                            </div>
                        )}
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('react-search-bar'));
            root.render(<SearchBar />);
            /*]]>*/
        </script>
    </nav>

</body>

</html>

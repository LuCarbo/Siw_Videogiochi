<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - Game Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <main class="login-wrapper">
        <div class="login-card" style="max-width: 480px;">

            <div style="text-align: center; margin-bottom: 1.5rem;">
                <a th:href="@{/}" style="font-weight: 700; font-size: 1.25rem; color: var(--text-main); text-decoration: none; letter-spacing: -0.02em;">
                    GAME<span style="color: var(--primary);">VAULT</span>
                </a>
            </div>

            <h1 class="login-title">Crea un Account</h1>
            <p class="login-subtitle">Entra nella community per salvare giochi e pubblicare recensioni</p>

            <form th:action="@{/register}" th:object="${registrazioneForm}" method="post">
                
                <div class="form-group">
                    <label for="username" class="form-label">Nome Utente *</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" autocomplete="username" placeholder="es. alex_gamer" />
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Indirizzo Email *</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" autocomplete="email" placeholder="nome@dominio.it" />
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password *</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" autocomplete="new-password" placeholder="Minimo 6 caratteri" />
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Conferma Password *</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" autocomplete="new-password" placeholder="Ripeti la password" />
                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1.5rem;">
                    Completa Registrazione
                </button>
            </form>

            <hr class="divider">

            <p style="text-align: center; color: var(--text-muted); font-size: 0.88rem;">
                Hai già un account registrato? 
                <a th:href="@{/login}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Accedi qui</a>
            </p>

            <p style="text-align: center; margin-top: 0.75rem;">
                <a th:href="@{/}" style="color: var(--text-muted); font-size: 0.82rem; text-decoration: none;">← Torna alla Home</a>
            </p>

        </div>
    </main>

</body>

</html>

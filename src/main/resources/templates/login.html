<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Accedi - Game Vault</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">

            <h1 class="login-title">Accedi a Game Vault</h1>
            <p class="login-subtitle">La tua libreria personale</p>

            <!-- Errore (Credenziali errate) -->
            <div th:if="${param.error}" class="error-msg">
                Username o password non validi.
            </div>

            <!-- Successo Registrazione -->
            <div th:if="${param.registered}" style="background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); color: #4ade80; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; font-size: 0.9rem;">
                Registrazione completata con successo! Ora puoi accedere.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required autocomplete="off" />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Entra
                </button>
            </form>

            <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 1.25rem;">
                Non hai ancora un account?
                <a th:href="@{/register}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Registrati qui</a>
            </p>

            <hr class="divider">

            <p class="login-subtitle-small">
                Oppure accedi con un tuo account:
            </p>

            <a th:href="@{/oauth2/authorization/google}" class="btn btn-google btn-full">
                Accedi con Google
            </a>

        </div>
    </div>

</body>

</html>

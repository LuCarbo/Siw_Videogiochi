<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esplora Videogiochi - SIW Videogiochi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">
        <div class="page-header">
            <h1 class="page-title">Esplora Videogiochi</h1>
            <p class="page-subtitle">Scopri i titoli più giocati e popolari della community.</p>
        </div>

        <!-- Filtri di Ricerca e Ordinamento -->
        <form th:action="@{/rawg/popolari}" method="get" class="filters-bar">
            <div class="filter-item">
                <label for="ordering" class="form-label">Ordina per</label>
                <select id="ordering" name="ordering" class="form-control">
                    <option value="-added" th:selected="${ordering == '-added'}">Popolarità (Più aggiunti)</option>
                    <option value="-released" th:selected="${ordering == '-released'}">Data di uscita (Più recenti)</option>
                    <option value="released" th:selected="${ordering == 'released'}">Data di uscita (Meno recenti)</option>
                    <option value="-metacritic" th:selected="${ordering == '-metacritic'}">Votazione Metacritic (Decrescente)</option>
                    <option value="metacritic" th:selected="${ordering == 'metacritic'}">Votazione Metacritic (Crescente)</option>
                    <option value="name" th:selected="${ordering == 'name'}">Nome alfabetico (A-Z)</option>
                </select>
            </div>

            <div class="filter-item">
                <label for="dlc_filter" class="form-label">Tipologia di Contenuto</label>
                <select id="dlc_filter" name="dlc_filter" class="form-control">
                    <option value="all" th:selected="${dlc_filter == 'all'}">Tutti i contenuti (Giochi + DLC)</option>
                    <option value="games" th:selected="${dlc_filter == 'games'}">Solo Giochi completi</option>
                    <option value="dlc" th:selected="${dlc_filter == 'dlc'}">Solo DLC ed espansioni</option>
                </select>
            </div>

            <input type="hidden" name="search" th:value="${search}" th:if="${search != null && !search.isEmpty()}" />
            <div>
                <button type="submit" class="btn btn-primary">
                    Applica Filtri
                </button>
            </div>
        </form>

        <!-- Griglia dei Giochi RAWG -->
        <div class="games-grid" th:if="${giochi != null && !giochi.isEmpty()}">
            <a th:each="gioco : ${giochi}" th:href="@{/rawg/gioco/{id}(id=${gioco.id})}" class="game-card">
                <div class="card-cover-wrap">
                    <img th:src="${gioco.background_image != null ? gioco.background_image : '/images/placeholder.svg'}"
                         onerror="this.onerror=null;this.src='/images/placeholder.svg';"
                         alt="Cover" class="card-cover" />
                </div>
                <div class="card-body">
                    <h2 class="card-title" th:text="${gioco.name}">Nome Gioco</h2>
                    <div class="card-meta">
                        <span th:text="${gioco.released != null ? 'Uscita: ' + gioco.released : 'Data sconosciuta'}">Data Rilascio</span>
                        <span th:if="${gioco.metacritic != null}" class="badge badge-score" th:text="${gioco.metacritic}">90</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- Controlli di Paginazione con Selettore Numerico -->
        <nav aria-label="Paginazione" class="pagination-bar" th:if="${giochi != null && !giochi.isEmpty()}">
            <!-- Pulsante Precedente -->
            <a th:if="${hasPrev}"
               th:href="@{/rawg/popolari(page=${currentPage - 1}, ordering=${ordering}, dlc_filter=${dlc_filter}, search=${search})}"
               class="btn btn-secondary btn-page">
                ← Precedente
            </a>
            <span th:unless="${hasPrev}" class="btn btn-secondary btn-page btn-disabled">
                ← Precedente
            </span>

            <!-- Salto alla prima pagina se il blocco inizia dopo pagina 1 -->
            <a th:if="${pageNumbers != null && !pageNumbers.isEmpty() && pageNumbers[0] > 1}"
               th:href="@{/rawg/popolari(page=1, ordering=${ordering}, dlc_filter=${dlc_filter}, search=${search})}"
               class="btn-page-num">
                1
            </a>
            <span th:if="${pageNumbers != null && !pageNumbers.isEmpty() && pageNumbers[0] > 2}" class="pagination-ellipsis">
                &hellip;
            </span>

            <!-- Numeri di Pagina (es. 1, 2, 3, 4, 5) -->
            <th:block th:each="pageNum : ${pageNumbers}">
                <!-- Pagina Corrente Attiva -->
                <span th:if="${pageNum == currentPage}"
                      class="btn-page-num btn-page-active"
                      th:text="${pageNum}">1</span>

                <!-- Altra Pagina Cliccabile -->
                <a th:unless="${pageNum == currentPage}"
                   th:href="@{/rawg/popolari(page=${pageNum}, ordering=${ordering}, dlc_filter=${dlc_filter}, search=${search})}"
                   class="btn-page-num"
                   th:text="${pageNum}">2</a>
            </th:block>

            <!-- Salto all'ultima pagina se il blocco termina prima dell'ultima pagina -->
            <span th:if="${pageNumbers != null && !pageNumbers.isEmpty() && pageNumbers[pageNumbers.size() - 1] < totalPages - 1}" class="pagination-ellipsis">
                &hellip;
            </span>
            <a th:if="${pageNumbers != null && !pageNumbers.isEmpty() && pageNumbers[pageNumbers.size() - 1] < totalPages}"
               th:href="@{/rawg/popolari(page=${totalPages}, ordering=${ordering}, dlc_filter=${dlc_filter}, search=${search})}"
               class="btn-page-num"
               th:text="${totalPages}">50</a>

            <!-- Pulsante Successiva -->
            <a th:if="${hasNext}"
               th:href="@{/rawg/popolari(page=${currentPage + 1}, ordering=${ordering}, dlc_filter=${dlc_filter}, search=${search})}"
               class="btn btn-secondary btn-page">
                Successiva →
            </a>
            <span th:unless="${hasNext}" class="btn btn-secondary btn-page btn-disabled">
                Successiva →
            </span>
        </nav>

        <div th:if="${giochi == null || giochi.isEmpty()}" class="empty-state">
            <h3>Nessun risultato trovato</h3>
            <p>Nessun videogioco trovato con i filtri selezionati.</p>
            <a th:href="@{/rawg/popolari}" class="btn btn-secondary">Ripristina Filtri</a>
        </div>
    </main>

</body>

</html>

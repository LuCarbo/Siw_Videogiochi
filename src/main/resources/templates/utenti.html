<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Utenti - SIW Videogiochi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container" style="max-width: 860px;">
        <div class="page-header">
            <div>
                <h1 class="page-title">Community Utenti</h1>
                <p class="page-subtitle">Elenco degli utenti registrati e consultazione delle loro collezioni personali.</p>
            </div>
            <span class="badge badge-user" th:if="${utenti != null}" th:text="${utenti.size()} + ' utenti'">0 utenti</span>
        </div>

        <div th:if="${utenti != null and !utenti.empty}" class="user-list">
            <article th:each="u : ${utenti}" class="user-card-row">
                <div class="user-info-cluster">
                    <div class="avatar">
                        <span th:text="${#strings.substring(u.username, 0, 1).toUpperCase()}">U</span>
                    </div>
                    <div>
                        <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.2rem;">
                            <a th:href="@{/utente/{id}(id=${u.id})}" style="font-weight: 600; font-size: 1.05rem; color: var(--text-main); text-decoration: none;" th:text="${u.username}">Username</a>
                            <span th:if="${u.ruolo == 'ADMIN'}" class="badge badge-admin">ADMIN</span>
                            <span th:if="${u.ruolo == 'USER'}" class="badge badge-user">USER</span>
                        </div>
                        <small style="color: var(--text-muted); font-size: 0.8rem;" th:text="'Registrato il: ' + ${u.dataRegistrazione}">Data</small>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span class="badge badge-user" th:text="${(u.videogiocoLibreria != null ? u.videogiocoLibreria.size() : 0) + ' in libreria'}">0 giochi</span>
                    <a th:href="@{/utente/{id}(id=${u.id})}" class="btn btn-secondary btn-sm">
                        Profilo
                    </a>
                </div>
            </article>
        </div>

        <div th:if="${utenti == null or utenti.empty}" class="empty-state">
            <h3>Nessun utente registrato</h3>
            <p>La piattaforma non contiene ancora profili utente registrati.</p>
        </div>
    </main>

</body>

</html>

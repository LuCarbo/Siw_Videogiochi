<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Utenti - Game Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container" style="max-width: 900px; padding: 2rem;">
        <div class="page-header" style="margin-bottom: 2rem;">
            <h1 class="page-title">Community Utenti</h1>
            <p style="color: var(--text-muted);">Elenco dei profili registrati sulla piattaforma.</p>
        </div>

        <div th:if="${utenti != null and !utenti.empty}" style="display: flex; flex-direction: column; gap: 1rem;">
            <div th:each="u : ${utenti}" 
                 style="background: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 1.25rem 1.75rem; display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s;">
                <div style="display: flex; align-items: center; gap: 1.25rem;">
                    <div style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #8e2de2, #4a00e0); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; color: white;">
                        <span th:text="${#strings.substring(u.username, 0, 1).toUpperCase()}">U</span>
                    </div>
                    <div>
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <h3 style="margin: 0; font-size: 1.15rem; color: #fff;" th:text="${u.username}">Username</h3>
                            <span th:if="${u.ruolo == 'ADMIN'}" 
                                  style="background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.4); font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 600;">
                                ADMIN
                            </span>
                        </div>
                        <small style="color: var(--text-muted);" th:text="'Registrato il: ' + ${u.dataRegistrazione}">Data</small>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 1rem;">
                    <span style="color: var(--text-muted); font-size: 0.9rem;"
                          th:text="${(u.videogiocoLibreria != null ? u.videogiocoLibreria.size() : 0) + ' giochi in libreria'}">0 giochi</span>
                    <a th:href="@{/utente/{id}(id=${u.id})}" class="btn" 
                       style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-size: 0.9rem;">
                        Visualizza Profilo
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${utenti == null or utenti.empty}"
             style="text-align: center; margin-top: 3rem; color: var(--text-muted); background: var(--surface); padding: 3rem; border-radius: 12px;">
            <p>Nessun utente registrato.</p>
        </div>
    </div>

</body>

</html>
